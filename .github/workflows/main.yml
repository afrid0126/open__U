
name: Autonomous Bug Fixing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Project Files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name "*.py" -not -path "./.git/*"

      - name: Run Python Project
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u error_tests.py 2>&1 | tee error.log

      - name: Upload Error Log
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: python-error-log
          path: error.log

      - name: Send Error to Local AI Agent
        if: steps.test.outcome == 'failure'
        env:
          WEBHOOK_URL: ${{ secrets.AGENT_WEBHOOK_URL }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          ERROR_MESSAGE=$(cat error.log)

          PAYLOAD=$(jq -n \
            --arg repo_url "$REPO_URL" \
            --arg error_message "$ERROR_MESSAGE" \
            --arg branch "$BRANCH" \
            '{
              repo_url: $repo_url,
              error_message: $error_message,
              branch: $branch
            }')

          curl --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
